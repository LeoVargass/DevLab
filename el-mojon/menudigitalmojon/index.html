<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Menú · El Mojón</title>
  <meta name="description" content="Menú digital de El Mojón. Empanadas, cocina regional y árabe en San Salvador de Jujuy." />
  <meta name="theme-color" content="#8d2222" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400..700&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Nunito:wght@300..800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="shell">
    <!-- HERO -->
    <header class="hero">
      <div class="hero__bg"></div>
      <div class="hero__veil"></div>
      <div class="hero__logo" aria-label="Logo de El Mojón">
        <!-- user will fill with real logo -->
      </div>
      <h1 class="hero__name">El Mojón</h1>
      <a href="../web/" target="_blank" rel="noopener" class="hero__more">Ver más <span aria-hidden="true">›</span></a>
    </header>

    <!-- Sticky top bar: search + tabs -->
    <div class="toolbar" id="toolbar">
      <label class="search">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <input id="search" type="search" placeholder="Buscar por producto…" autocomplete="off" aria-label="Buscar producto" />
        <button class="search__clear" id="searchClear" aria-label="Limpiar" hidden>×</button>
      </label>

      <nav class="tabs" aria-label="Categorías">
        <div class="tabs__inner" id="tabsInner"></div>
      </nav>
    </div>

    <!-- MENU -->
    <main id="menu" class="menu">
      <div id="emptyResults" class="empty" hidden>
        <p>Sin resultados para tu búsqueda.</p>
      </div>
    </main>

    <!-- Social -->
    <section class="socials" aria-label="Seguinos">
      <h2 class="socials__title">Seguinos</h2>
      <div class="socials__row">
        <a class="social social--fb" href="https://www.facebook.com/empanadas.elmojon/" target="_blank" rel="noopener" aria-label="Facebook de El Mojón">
          <svg viewBox="0 0 24 24" width="28" height="28" aria-hidden="true"><path fill="currentColor" d="M22 12.07C22 6.5 17.52 2 12 2S2 6.5 2 12.07c0 5.02 3.66 9.18 8.44 9.93v-7.02H7.9v-2.91h2.54V9.86c0-2.51 1.49-3.9 3.78-3.9 1.1 0 2.24.2 2.24.2v2.47h-1.26c-1.24 0-1.63.77-1.63 1.56v1.88h2.78l-.44 2.91h-2.34V22c4.78-.75 8.43-4.91 8.43-9.93z"/></svg>
          <span class="sr-only">Facebook</span>
        </a>
        <a class="social social--ig" href="#instagram" target="_blank" rel="noopener" aria-label="Instagram de El Mojón" data-pending="instagram">
          <svg viewBox="0 0 24 24" width="28" height="28" aria-hidden="true"><path fill="currentColor" d="M7.5 2h9A5.5 5.5 0 0 1 22 7.5v9a5.5 5.5 0 0 1-5.5 5.5h-9A5.5 5.5 0 0 1 2 16.5v-9A5.5 5.5 0 0 1 7.5 2zm0 2A3.5 3.5 0 0 0 4 7.5v9A3.5 3.5 0 0 0 7.5 20h9a3.5 3.5 0 0 0 3.5-3.5v-9A3.5 3.5 0 0 0 16.5 4h-9zM12 7a5 5 0 1 1 0 10 5 5 0 0 1 0-10zm0 2a3 3 0 1 0 0 6 3 3 0 0 0 0-6zm5.75-2.25a1.25 1.25 0 1 1 0 2.5 1.25 1.25 0 0 1 0-2.5z"/></svg>
          <span class="sr-only">Instagram</span>
        </a>
      </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
      <h3 class="footer__name">El Mojón</h3>
      <p class="footer__line">Gral. San Martín 858 · San Salvador de Jujuy</p>
      <p class="footer__line"><a href="tel:+543884235761">+54 388 423-5761</a></p>
      <ul class="hours">
        <li><span>Lunes</span><strong>Cerrado</strong></li>
        <li><span>Martes a sábado</span><strong>11:00–15:00 · 20:00–00:00</strong></li>
        <li><span>Domingo</span><strong>11:00–15:00</strong></li>
      </ul>
      <small class="footer__fine">© 2026 El Mojón · 25 años cocinando Jujuy</small>
    </footer>
  </div>

  <!-- Floating back-to-top -->
  <button class="totop" id="toTop" aria-label="Volver arriba">↑</button>

  <script src="data.js" defer></script>
  <script src="script.js" defer></script>
</body>
</html>
